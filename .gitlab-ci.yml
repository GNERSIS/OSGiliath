# OSGiliath GitLab CI — adapted from l0's pipeline for a single-lib repo.
#
# Component-staged static-analysis matrix (l0-faithful):
#   format → src → applications → examples → tests   (docs stage dropped)
#
# Within each runnable component stage, five KINDS run in parallel — each its
# own build dir + per-kind ccache (mirrors l0's tier×kind matrix):
#   build → optimized no-sanitizer compile + 0-warning clang-tidy gate
#   asan  → ASan+UBSan always-on; RUN ctest / headless smoke
#   tsan  → ThreadSanitizer (+UBSan); RUN non-GL ctest / smoke
#   msan  → MemorySanitizer (+UBSan) w/ instrumented libc++; RUN non-GL ctest
#   iwyu  → include-what-you-use gate (any add/remove recommendation fails)
#
# Component = which CMake targets build/run (scoped by BUILD_* options):
#   src           → lib + osgdb_* plugins (compile-only; build kind = tidy gate)
#   applications  → application_* + non-GL app smoke (osgversion / osgconv)
#   examples      → example_*     + headless render smoke (Xvfb + llvmpipe)
#   tests         → 3 gtest bins + ctest
#
# msan-applications, msan-examples and tsan-examples are COMPILE-ONLY, but they
# are REAL jobs that run ci-run.sh and actually compile — never skipped, never
# allow_failure, never manual. Manufacturing green via skips is forbidden.
#
# All logic lives in .gitlab/scripts/ci-run.sh — the YAML is a thin wrapper, so
# local runs (`./.gitlab/scripts/ci-run.sh <kind> <component>`) and CI are
# structurally identical.
#
# Image: built LOCALLY on the runner host (legion) from
# .gitlab/ci-image.Dockerfile; the runner's pull_policy=if-not-present
# means it is never pulled from a registry:
#   docker build -f .gitlab/ci-image.Dockerfile \
#                -t registry.gitlab.com/a1z3n/osgiliath/ci:clang-23 .

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never                       # avoid duplicate runs when MR is open
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: "registry.gitlab.com/a1z3n/osgiliath/ci:clang-23"
  before_script:
    - mkdir -p "${CCACHE_DIR}"
    - ccache --max-size="${CCACHE_MAXSIZE}" >/dev/null
    - ccache --zero-stats >/dev/null
  after_script:
    - ccache --show-stats || true
  retry:
    # The legion runner is shared with other heavy projects; the ASan/TSan
    # app-smoke jobs occasionally OOM/contention-flake (each is verified green in
    # isolation — a clean cold-clone run passes with zero findings). Retry
    # tolerates that environmental flakiness: a DETERMINISTIC failure still fails
    # after all retries (NOT masked), only transient ones recover.
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure

variables:
  # /ccache is a persistent host bind-mount (see register-runner.sh);
  # keyed per kind so each kind's object cache doesn't evict the others.
  CCACHE_DIR: "/ccache/default"
  CCACHE_MAXSIZE: "10G"
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_COMPILERCHECK: "content"
  GIT_DEPTH: "10"
  # Cap per-job build/test parallelism. The legion runner is concurrent=4 and
  # shared with other projects, so unbounded -j$(nproc)=-j32 across 4 concurrent
  # sanitizer builds oversubscribes 32 cores (~128 procs) and the memory-heavy
  # ASan/TSan/MSan builds OOM-flake. nproc/4 keeps total compile concurrency at
  # ~cores. ci-run.sh's nproc_value() honours JFACTOR.
  JFACTOR: "8"

# Stage ordering gates execution: the component stages run strictly in
# dependency order — `src` must be green before `applications`, `examples`
# and `tests` start (OSGiliath is ONE shared lib that the rest link, so src
# is the chain gate). Within a stage the 5 kinds run in parallel when the
# runner has concurrent > 1. No `needs:` anywhere — `needs` would switch
# GitLab to DAG mode and bypass the stage gate (l0 + OSGiliath invariant).
stages:
  - format
  - src
  - applications
  - examples
  - tests

format:
  stage: format
  dependencies: []
  script:
    - .gitlab/scripts/ci-run.sh format
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - format.log
      - format-files.txt

# ── Per-kind templates ──────────────────────────────────────────────────────
# Hidden jobs (leading dot) are pulled in via `extends:` — never executed
# themselves. Each carries the kind's ccache dir, the 3h heavy-job timeout,
# empty `dependencies:` (artifacts never propagate between stages), and the
# kind's artifact/JUnit shape. The component-specific bit (stage + the
# ci-run.sh args) is set on the concrete jobs below.

.kind-build:
  variables:
    CCACHE_DIR: "/ccache/build"
  dependencies: []
  timeout: 3h
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      # build.log is multi-GB (tidy notes per TU) — deliberately NOT shipped.
      - build/build-tail.log
      - build/build-results.xml
      - build/tidy-warning-summary.txt
      - build/tidy-warnings-unique.log
      - build/smoke/*.png                # render/app smoke output (debug on fail)
    reports:
      junit: build/build-results.xml

.kind-asan:
  variables:
    CCACHE_DIR: "/ccache/asan"
  dependencies: []
  timeout: 3h
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build-asan/build-tail.log
      - build-asan/asan-results.xml
      - build-asan/smoke/*.png
    reports:
      junit: build-asan/asan-results.xml

.kind-tsan:
  variables:
    CCACHE_DIR: "/ccache/tsan"
  dependencies: []
  timeout: 3h
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      # No smoke/*.png glob: under tsan, examples are compile-only and the
      # applications app-smoke (osgversion/osgconv) writes no PNG — nothing ever
      # lands in build-tsan/smoke/, so the glob would only match nothing.
      - build-tsan/build-tail.log
      - build-tsan/tsan-results.xml
    reports:
      junit: build-tsan/tsan-results.xml

.kind-msan:
  variables:
    CCACHE_DIR: "/ccache/msan"
  dependencies: []
  timeout: 3h
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      # No smoke/*.png glob: msan runs every component compile-only or ctest
      # (no render/app smoke at all) — nothing ever lands in build-msan/smoke/.
      - build-msan/build-tail.log
      - build-msan/msan-results.xml
    reports:
      junit: build-msan/msan-results.xml

.kind-iwyu:
  variables:
    CCACHE_DIR: "/ccache/iwyu"
  dependencies: []
  timeout: 3h
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      # build-iwyu-build.log is multi-GB (tidy noise per TU) — NOT shipped.
      - build-iwyu/build-tail.log
      - build-iwyu/iwyu-recommendations.txt
      - build-iwyu/iwyu-results.xml
    reports:
      junit: build-iwyu/iwyu-results.xml

# ── src ─────────────────────────────────────────────────────────────────────
# Compile-only (lib + osgdb_* plugins). The build kind additionally runs the
# 0-warning clang-tidy gate here.

build-src:
  extends: .kind-build
  stage: src
  script:
    - .gitlab/scripts/ci-run.sh build src

asan-src:
  extends: .kind-asan
  stage: src
  script:
    - .gitlab/scripts/ci-run.sh asan src

tsan-src:
  extends: .kind-tsan
  stage: src
  script:
    - .gitlab/scripts/ci-run.sh tsan src

msan-src:
  extends: .kind-msan
  stage: src
  script:
    - .gitlab/scripts/ci-run.sh msan src

iwyu-src:
  extends: .kind-iwyu
  stage: src
  script:
    - .gitlab/scripts/ci-run.sh iwyu src

# ── applications ─────────────────────────────────────────────────────────────
# build/asan/tsan → compile + non-GL app smoke. msan → compile-only (apps pull
# GL + uninstrumented C). All five are REAL jobs that compile.

build-applications:
  extends: .kind-build
  stage: applications
  script:
    - .gitlab/scripts/ci-run.sh build applications

asan-applications:
  extends: .kind-asan
  stage: applications
  script:
    - .gitlab/scripts/ci-run.sh asan applications

tsan-applications:
  extends: .kind-tsan
  stage: applications
  script:
    - .gitlab/scripts/ci-run.sh tsan applications

msan-applications:
  extends: .kind-msan
  stage: applications
  script:
    - .gitlab/scripts/ci-run.sh msan applications

iwyu-applications:
  extends: .kind-iwyu
  stage: applications
  script:
    - .gitlab/scripts/ci-run.sh iwyu applications

# ── examples ─────────────────────────────────────────────────────────────────
# build/asan → compile + headless render smoke (Xvfb + llvmpipe).
# tsan/msan → compile-only (GL driver threads / uninstrumented C). All real.

build-examples:
  extends: .kind-build
  stage: examples
  script:
    - .gitlab/scripts/ci-run.sh build examples

asan-examples:
  extends: .kind-asan
  stage: examples
  script:
    - .gitlab/scripts/ci-run.sh asan examples

tsan-examples:
  extends: .kind-tsan
  stage: examples
  script:
    - .gitlab/scripts/ci-run.sh tsan examples

msan-examples:
  extends: .kind-msan
  stage: examples
  script:
    - .gitlab/scripts/ci-run.sh msan examples

iwyu-examples:
  extends: .kind-iwyu
  stage: examples
  script:
    - .gitlab/scripts/ci-run.sh iwyu examples

# ── tests ────────────────────────────────────────────────────────────────────
# All 3 gtest bins are non-GL → ctest runs under every sanitizer.

build-tests:
  extends: .kind-build
  stage: tests
  script:
    - .gitlab/scripts/ci-run.sh build tests

asan-tests:
  extends: .kind-asan
  stage: tests
  script:
    - .gitlab/scripts/ci-run.sh asan tests

tsan-tests:
  extends: .kind-tsan
  stage: tests
  script:
    - .gitlab/scripts/ci-run.sh tsan tests

msan-tests:
  extends: .kind-msan
  stage: tests
  script:
    - .gitlab/scripts/ci-run.sh msan tests

iwyu-tests:
  extends: .kind-iwyu
  stage: tests
  script:
    - .gitlab/scripts/ci-run.sh iwyu tests
